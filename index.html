<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B5BD6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F13" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Yingua AI PDF" />
    <script>
      /* Applied before the first paint. Without this the page renders once in
         light mode and then again in dark, which on a dark-mode machine is a
         white flash on every single load. It duplicates src/services/theme.js on
         purpose: this has to run as a blocking inline script, before the module
         graph and the stylesheet are even fetched. */
      ;(function () {
        try {
          var mode = localStorage.getItem('yingua.theme')
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* Blocked storage: fall back to the light default the CSS declares. */
        }
      })()
    </script>
    <meta
      name="description"
      content="Yingua AI PDF - read PDFs in your browser with AI translation, explanation, simplification and summaries."
    />
    <title>Yingua AI PDF</title>
    <script type="module" crossorigin src="/assets/index-B_06VTb0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BylaWc4J.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
